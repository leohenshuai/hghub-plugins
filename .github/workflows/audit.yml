name: 片源每日体检

on:
  schedule:
    - cron: '0 20 * * *'      # 每天 UTC 20:00 ≈ 巴西时间 17:00
  workflow_dispatch:
    inputs:
      ids:
        description: '只检查这些源（空格分隔，留空=全部）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 安装依赖
        run: |
          cd tools && npm install --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq quickjs || echo "quickjs 装不上，跳过卡死检查"

      - name: 功能体检（分类/首页/搜索/详情/播放流）
        id: audit
        continue-on-error: true
        env:
          MAX_CATS: '8'          # 分类抽样，避免 60+ 分类的源跑太久
        run: |
          IDS="${{ github.event.inputs.ids }}"
          [ -z "$IDS" ] && IDS=$(ls plugins/*.js | xargs -n1 basename | sed 's/\.js$//' | tr '\n' ' ')
          echo "检查：$IDS"
          node tools/audit.mjs $IDS > audit.jsonl 2> audit.log || true
          tail -c 4000 audit.log

      - name: 卡死检查（QuickJS 同步执行时长）
        id: guard
        continue-on-error: true
        run: |
          command -v qjs >/dev/null || { echo '{"skipped":true}' > guard.log; exit 0; }
          IDS="${{ github.event.inputs.ids }}"
          GUARD_JSON=1 node tools/guard.mjs $IDS > guard.log 2>&1 || true
          tail -c 3000 guard.log

      - name: 汇总结果
        id: report
        run: node tools/report.mjs audit.jsonl guard.log

      - name: 提交状态表
        run: |
          git config user.name  'hghub-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add STATUS.md
          git diff --cached --quiet || git commit -m "chore: 每日体检 $(date -u +%Y-%m-%d)"
          git push

      - name: 有问题时开 issue
        if: steps.report.outputs.failed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue.md', 'utf8');
            const title = `片源体检：${{ steps.report.outputs.failed }} 个源有问题（${new Date().toISOString().slice(0,10)}）`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'audit' });
            if (open.data.length) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.data[0].number, title, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['audit'] });
            }
